<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UTA</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="browse-page">

    <div class="browser-bar">
      <a class="brand hide-mobile" href="/" title="На главную" style="margin-right:8px">
        <img src="/logo.svg" alt="UTA" style="width:26px;height:26px">
      </a>

      <button class="browser-btn" id="backBtn" title="Назад (Alt+←)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      </button>
      <button class="browser-btn" id="forwardBtn" title="Вперёд (Alt+→)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>
      <button class="browser-btn" id="reloadBtn" title="Обновить (F5)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>
      </button>
      <button class="browser-btn" id="homeBtn" title="На главную">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      </button>

      <div class="address">
        <span class="lock" id="lockIcon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input type="text" id="addressInput" placeholder="Поиск или адрес сайта" spellcheck="false" autocomplete="off">
      </div>

      <button class="browser-btn" id="externalBtn" title="Открыть сайт в новой вкладке">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
      </button>

      <div id="userArea" style="margin-left:6px"></div>
    </div>

    <div class="loading-line" id="loadingLine"></div>

    <iframe
      id="view"
      class="browser-frame"
      title="Просмотр сайта"
      sandbox="allow-scripts allow-forms allow-popups"
      referrerpolicy="no-referrer"
    ></iframe>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/browse.js"></script>
</body>
</html>
