<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UTA — простой браузер</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="topbar">
    <a class="brand" href="/">
      <img src="/logo.svg" alt="UTA">
      <span>UTA</span>
    </a>
    <div id="userArea"></div>
  </header>

  <main class="home-hero">
    <div class="hero-logo">
      <img src="/logo.svg" alt="UTA">
      <h1><span class="grad-text">UTA</span></h1>
    </div>
    <p class="hero-sub">Простой браузер: введи адрес сайта или запрос для поиска</p>

    <form class="search-wrap" id="searchForm" autocomplete="off">
      <div class="engine-wrap">
        <button type="button" class="engine-btn" id="engineBtn">
          <span id="engineLabel">DuckDuckGo</span> ▾
        </button>
        <div class="engine-pop" id="enginePop">
          <label><input type="radio" name="engine" value="ddg" checked> DuckDuckGo</label>
          <label><input type="radio" name="engine" value="google"> Google</label>
          <label><input type="radio" name="engine" value="yandex"> Яндекс</label>
          <label><input type="radio" name="engine" value="bing"> Bing</label>
        </div>
      </div>
      <input
        type="text"
        id="searchInput"
        placeholder="Поиск или адрес сайта, например uta.com"
        autofocus
      >
      <button type="submit" class="search-go" title="Найти" aria-label="Найти">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
      </button>
    </form>
  </main>

  <section class="home-section">
    <h2>
      Недавние сайты
      <button class="link-btn" id="clearHistory" style="display:none">Очистить</button>
    </h2>
    <div class="history-grid" id="historyGrid"></div>
  </section>

  <script src="/js/common.js"></script>
  <script src="/js/home.js"></script>
</body>
</html>
